name: Screaming Penguin QEMU Acceptance

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 0"  # Weekly on Sunday at 04:00 UTC

jobs:
  qemu-acceptance:
    name: QEMU Acceptance (Happy Path)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show environment info
        run: |
          uname -a
          echo "Shell: $SHELL"

      - name: Install QEMU and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            xz-utils \
            tar \
            dosfstools \
            parted \
            gdisk

      - name: Build installer image (make iso)
        run: |
          echo "[CI-QEMU] Building Screaming Penguin installer image…"
          make iso
          echo "[CI-QEMU] dist/ contents after iso build:"
          ls -lh dist || true

      - name: Build Debian rootfs (make rootfs)
        run: |
          echo "[CI-QEMU] Building Debian rootfs (Bookworm)…"
          make rootfs
          echo "[CI-QEMU] dist/ contents after rootfs build:"
          ls -lh dist || true

      - name: Run QEMU acceptance harness
        run: |
          echo "[CI-QEMU] Running QEMU acceptance harness (happy path)…"
          make qemu-acceptance
          echo "[CI-QEMU] Build directory contents after QEMU acceptance:"
          ls -lh build || true

      - name: Upload QEMU logs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qemu-acceptance-logs
          path: |
            build/qemu-install.log
            build/qemu-installed-boot.log
          if-no-files-found: warn

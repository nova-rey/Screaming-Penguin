name: CI Smoke

on:
  push:
    branches:
      - main
      - master
      - develop
      - "**/feature/**"
  pull_request:

jobs:
  smoke:
    name: Smoke validation (PR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEBIAN_FRONTEND: noninteractive
      CI_SMOKE_PYTEST_TIMEOUT_SECONDS: 600
      CI_SMOKE_FULL_INSTALLER: 0
      PYTHONUNBUFFERED: 1
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show environment info
        run: |
          set -euxo pipefail
          uname -a
          lsb_release -a || true
          echo "Shell: $SHELL"

      - name: Install shellcheck + Python tooling
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck python3 python3-pip python3-pytest
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout pyfatfs ruff black

      - name: Run CI smoke suite
        run: |
          set -euxo pipefail
          make ci-smoke

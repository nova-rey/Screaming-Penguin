name: Screaming Penguin CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - "**/feature/**"
  pull_request:

jobs:
  ci:
    name: Lint, Build Image, QEMU Smoke
    runs-on: ubuntu-latest

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show environment info
        run: |
          uname -a
          lsb_release -a || true
          echo "Shell: $SHELL"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            shellcheck \
            qemu-system-x86 \
            parted \
            kpartx \
            dosfstools \
            util-linux \
            mount \
            xz-utils

      - name: ShellCheck all shell scripts
        run: |
          echo "[CI] Running ShellCheck on all *.sh files..."
          SH_FILES="$(git ls-files '*.sh')"
          if [ -n "$SH_FILES" ]; then
            shellcheck $SH_FILES
          else
            echo "[CI] No shell scripts found; skipping ShellCheck."
          fi

      - name: Build installer image (make iso)
        run: |
          echo "[CI] Running 'make iso' to build Screaming Penguin image..."
          sudo make iso
          # Ensure build/ and dist/ are owned by the current user, not root.
          if [ -d build ]; then
            sudo chown -R "$USER:$USER" build
          fi
          if [ -d dist ]; then
            sudo chown -R "$USER:$USER" dist
          fi
          ls -lh dist || true

      - name: QEMU smoke boot (BIOS)
        run: |
          echo "[CI] Running QEMU smoke test..."
          chmod +x ci/qemu_smoke_ci.sh
          ci/qemu_smoke_ci.sh

  # ISO CI job:
  # Builds a hybrid BIOS/UEFI-bootable ISO using grub-mkrescue.
  # Does not perform QEMU runtime tests yet.
  # Produces screaming-penguin.iso as an artifact.
  build_iso:
    name: "Build ISO Artifact"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GRUB + tools
        run: |
          sudo apt-get update
          sudo apt-get install -y grub-pc-bin grub-efi-amd64-bin xorriso mtools

      - name: Build ISO
        run: |
          echo "[CI-ISO] Running 'make iso'..."
          sudo make iso
          ls -lh dist

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: screaming-penguin-iso
          path: dist/screaming-penguin.iso

name: CI ISO Build

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  iso:
    name: Nightly ISO Build
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show environment info
        run: |
          set -euxo pipefail
          uname -a
          lsb_release -a || true
          echo "Shell: $SHELL"

      - name: Install ISO build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub-efi-amd64-signed \
            xorriso \
            isolinux \
            syslinux-common \
            mtools \
            dosfstools \
            parted \
            kpartx \
            util-linux \
            mount \
            xz-utils \
            cpio \
            gzip \
            busybox-static

      - name: Prepare CI debug summary
        run: |
          set -euxo pipefail
          echo "CI ISO build started at $(date -u +"%Y-%m-%dT%H:%M:%SZ")" > ci-debug-summary.txt

      - name: Runtime build
        run: |
          set -euxo pipefail
          echo "stage: runtime-build start at $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> ci-debug-summary.txt
          timeout 45m bash -c 'set -euxo pipefail && bash tools/ci_heartbeat.sh --label "runtime build" --interval 120 bash tools/build_runtime.sh'
          echo "stage: runtime-build complete at $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> ci-debug-summary.txt

      - name: Installer initramfs build
        run: |
          set -euxo pipefail
          echo "stage: installer-initramfs start at $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> ci-debug-summary.txt
          timeout 30m bash -c 'set -euxo pipefail && bash tools/ci_heartbeat.sh --label "installer initramfs build" --interval 120 bash tools/build_installer_initramfs.sh'
          echo "stage: installer-initramfs complete at $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> ci-debug-summary.txt

      - name: ISO assembly
        run: |
          set -euxo pipefail
          echo "stage: iso-assembly start at $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> ci-debug-summary.txt
          timeout 75m bash -c 'set -euxo pipefail && SP_SKIP_INSTALLER_INITRAMFS_BUILD=1 bash tools/ci_heartbeat.sh --label "ISO assembly" --interval 120 bash tools/make_installer_iso.sh'
          echo "stage: iso-assembly complete at $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> ci-debug-summary.txt
          ls -lh dist || true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-iso-failure-artifacts
          path: |
            build
            dist
            ci-debug-summary.txt
          if-no-files-found: warn
